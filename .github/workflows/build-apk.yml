name: Build APK
# APK builds are slow (~25 min), so pushes only build when something native changed. JS/UI-only changes
# ship through the OTA workflow (update.yml). Run this workflow manually from the Actions tab to force a build.
on:
  push:
    branches: [main]
    paths:
      - 'modules/**'          # Kotlin native module
      - 'app.json'            # permissions, plugins, updates config
      - 'eas.json'
      - 'package.json'        # dependencies (native libraries)
      - 'package-lock.json'
      - 'assets/**'           # icons and splash are bundled into the APK
      - 'babel.config.js'
      - 'metro.config.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      # the runtime fingerprint of this APK (what the OTA workflow publishes against). Computed before prebuild so it matches update.yml,
      # and written into the release notes so the app can tell whether a newer APK exists.
      - id: fp
        run: echo "hash=$(npx expo-updates fingerprint:generate --platform android | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).hash))')" >> "$GITHUB_OUTPUT"
      - run: npx expo prebuild --platform android --no-install
      # Signing: with the four ANDROID_* repository secrets set the release is signed with your own keystore (docs/release-signing.md);
      # without them it falls back to the template's debug key. Either way versionCode becomes the run number.
      - name: Prepare signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export KEYSTORE_PATH="$RUNNER_TEMP/release.jks" KEYSTORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD" KEY_ALIAS="$ANDROID_KEY_ALIAS" KEY_PASSWORD="$ANDROID_KEY_PASSWORD"
            echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          fi
          node .github/scripts/patch-android.mjs android/app/build.gradle
      # ponytail: arm64 only (every modern phone); drop the flag for 32-bit/x86 devices
      - run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a
        working-directory: android
      - run: cp android/app/build/outputs/apk/release/app-release.apk ExMan.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          prerelease: true
          body: |
            Sideload ExMan.apk (arm64).

            runtime: ${{ steps.fp.outputs.hash }}
          files: ExMan.apk
