name: OTA update
# Publishes JS/asset changes to installed builds in seconds-to-minutes (no APK rebuild).
# Builds only pick it up if their native fingerprint matches (runtimeVersion policy: fingerprint);
# native changes (Kotlin, permissions, new native deps) still need the APK workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ota
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    if: ${{ vars.OTA_ENABLED == 'true' }}   # set repo variable OTA_ENABLED=true once EXPO_TOKEN secret exists
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      # APKs built outside EAS Build ask the server for channel "main" (app.json updates.requestHeaders);
      # the channel must exist and point at the branch we publish to.
      - run: eas channel:view main --non-interactive > /dev/null 2>&1 || eas channel:create main --non-interactive
      - run: eas channel:edit main --branch main --non-interactive
      # EXPO_PUBLIC_* values are inlined into the JS bundle; leave the repo variable TELEMETRY_URL unset until the collector exists
      # The commit message goes in through an environment variable, never pasted into the script: quotes or
      # backticks in a commit/PR title used to break this command (and would be a script-injection hole).
      - run: eas update --branch main --platform android --message "${MSG:-manual}" --non-interactive
        env:
          EXPO_PUBLIC_TELEMETRY_URL: ${{ vars.TELEMETRY_URL }}
          MSG: ${{ github.event.head_commit.message }}
