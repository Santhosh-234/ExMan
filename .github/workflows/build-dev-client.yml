name: Build dev client
# Debug build with expo-dev-client: install once, then load JS from a Metro server (live reload) instead of rebuilding.
# Rebuild only when native code, permissions or native dependencies change.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - run: ./gradlew assembleDebug -PreactNativeArchitectures=arm64-v8a
        working-directory: android
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk ExMan-dev.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-client-${{ github.run_number }}
          name: Dev client ${{ github.run_number }}
          prerelease: true
          files: ExMan-dev.apk
